name: Core detection checks

on:
  pull_request:
    paths:
      - "backend/app/detection/core_rules.py"
      - "backend/rules/core/**"
      - "backend/core_rule_tests/**"
      - "backend/tests/test_core_rules.py"
      - "backend/tests/test_core_catalog.py"
      - ".github/workflows/core-detection.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/detection/core_rules.py"
      - "backend/rules/core/**"
      - "backend/core_rule_tests/**"
      - "backend/tests/test_core_rules.py"
      - "backend/tests/test_core_catalog.py"
      - ".github/workflows/core-detection.yml"

permissions:
  contents: read

jobs:
  core-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest ruff
      - run: python -m pytest -q core_rule_tests/test_core_rules_standalone.py
      - run: ruff check app/detection/core_rules.py core_rule_tests/test_core_rules_standalone.py
